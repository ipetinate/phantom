# SwiftLint <https://realm.github.io/SwiftLint/>
#
check_for_updates: false

excluded:
  - build

disabled_rules:
  - cyclomatic_complexity
  - file_length
  - function_body_length
  - line_length
  - nesting
  - no_fallthrough_only
  - todo
  - trailing_comma
  - trailing_newline
  - type_body_length

identifier_name:
  min_length: 1
  allowed_symbols: ["_"]
  excluded:
    - Core.*

type_name:
  min_length: 2
  allowed_symbols: ["_"]
  excluded:
    - iOS_.*

function_parameter_count:
  warning: 6

large_tuple:
  warning: 3

custom_rules:
  # Text(_:) takes a LocalizedStringKey, which applies the user's locale
  # number formatting to an interpolated integer: a PR #43301 renders as
  # "#43.301", a 4201 port as "4.201", line 1200 as "1.200". This app ships
  # no string catalog, so the localization buys nothing and the grouping is
  # pure damage. It has been fixed three times in three different views;
  # this makes the fourth one impossible.
  localized_number_interpolation:
    name: "Localized number interpolation"
    regex: 'Text\("[^"]*\\\([^)"]*([Cc]ount|[Nn]umber|[Ll]ine|[Tt]otal|[Pp]ort|[Ii]ndex|Int\(|Double\(|Float\(|CGFloat\()[^)"]*\)'
    message: "Text(_:) localizes interpolated numbers (1000 becomes \"1.000\"). Use Text(verbatim:)."
    severity: error
