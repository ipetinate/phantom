name: Phantom Release

# The fork's release pipeline. Ghostty's release-tag.yml is gone from this
# repo: it used infrastructure this fork has no access to (paid Namespace
# runners, Nix, a real Developer ID cert, R2).
# This builds, ad-hoc signs, packages and publishes a Phantom.dmg to this
# repo's own Releases page on every push to main — together with the Sparkle
# appcast the app updates itself from, so the Releases page is the whole of
# the update infrastructure.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: git rev-list --count and git tag -l both need it.
          fetch-depth: 0

      # The version comes from build.zig.zon, never from arithmetic over
      # existing tags.
      #
      # It used to take the highest `v*.*.*` and add one, which quietly
      # counted **Ghostty's** tags — this fork inherited v1.3.2 through
      # v1.3.4 — and so tagged our own merge v1.3.5 while build.zig.zon
      # still said 1.3.2-dev. The build refuses a tag that disagrees with
      # that file ("tagged releases must be in vX.Y.Z format matching
      # build.zig"), so main became unbuildable for anyone whose HEAD
      # landed on the tag. Reading the one file that declares the version
      # makes the two unable to drift.
      - name: Compute version
        id: version
        run: |
          DECLARED=$(grep -m1 '\.version' build.zig.zon | sed -E 's/.*"([^"]+)".*/\1/')

          # Any pre-release suffix is dropped for the tag, not just "-dev".
          # The suffix says how finished the build is — "-dev" while it is
          # being worked on, "-beta" once it is usable but still taking
          # fixes, nothing at all when it is stable — and the tag cannot
          # carry it: the Zig build refuses a tag that is not vX.Y.Z
          # matching build.zig. So the tag is the number and the release
          # *title* is what was declared, which is also what stops anyone
          # renaming releases by hand afterwards.
          VERSION=${DECLARED%%-*}
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "build.zig.zon version '$DECLARED' is not X.Y.Z with an optional suffix" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "v${VERSION} already exists — bump .version in build.zig.zon" >&2
            exit 1
          fi
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "title=v${DECLARED}" >> "$GITHUB_OUTPUT"
          echo "short_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"

      - name: Build
        run: zig build -Doptimize=ReleaseFast

      - name: Set version in Info.plist
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.short_version }}" zig-out/Phantom.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.version.outputs.build }}" zig-out/Phantom.app/Contents/Info.plist

      - name: Codesign (ad-hoc)
        run: |
          codesign --force --deep --sign - \
            --entitlements macos/GhosttyReleaseLocal.entitlements \
            zig-out/Phantom.app

      - name: Create DMG
        run: |
          npm install --global create-dmg
          # create-dmg's exit code isn't reliable even on success; the real
          # check is whether the file landed.
          create-dmg zig-out/Phantom.app . || true
          mv Phantom*.dmg Phantom.dmg
          test -f Phantom.dmg

      # The tools come from Sparkle's own release, pinned and checksummed like
      # every action in this file: the signature they produce is the one the
      # Sparkle framework inside the app verifies, and a tool that is not the
      # framework's own is a second implementation of the same contract.
      #
      # This version is the one the app links (Package.resolved). Raising it
      # here without raising it there is the drift this comment exists to
      # stop.
      - name: Sparkle tools
        env:
          SPARKLE_VERSION: "2.9.0"
          SPARKLE_SHA256: "01e0f0ebf6614061ea816d414de50f937d64ffa6822ad572243031ca3676fe19"
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          echo "${SPARKLE_SHA256}  /tmp/sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p /tmp/sparkle
          tar -xJf /tmp/sparkle.tar.xz -C /tmp/sparkle
          echo "/tmp/sparkle/bin" >> "$GITHUB_PATH"

      # The private key never touches the checkout: it is read from the secret
      # on standard input, which is the form sign_update documents for CI. An
      # unsigned DMG is refused before it can be published, because an item
      # the app cannot verify is worse than no item — every reader would see a
      # bad-signature error instead of an update.
      #
      # The previous feed is fetched so history survives: a reader several
      # versions behind still finds an entry. A missing feed (the first
      # release) starts a new one, and only that case is allowed to fail.
      - name: Sign and generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          PHANTOM_VERSION: ${{ steps.version.outputs.short_version }}
          PHANTOM_BUILD: ${{ steps.version.outputs.build }}
          PHANTOM_TAG: ${{ steps.version.outputs.tag }}
          PHANTOM_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${SPARKLE_PRIVATE_KEY}" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY is not set — the DMG cannot be signed, so no update can be published" >&2
            exit 1
          fi
          echo "${SPARKLE_PRIVATE_KEY}" | sign_update --ed-key-file - Phantom.dmg > sign_update.txt
          cat sign_update.txt
          curl -sSfL -o appcast.xml \
            "https://github.com/ipetinate/phantom/releases/latest/download/appcast.xml" \
            || { echo "no previous appcast — starting a new feed"; : > appcast.xml; }
          PHANTOM_COMMIT="${PHANTOM_COMMIT:0:9}" python3 ./dist/macos/phantom_appcast.py
          xmllint --noout appcast.xml

      - name: Tag
        run: |
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ steps.version.outputs.tag }} \
            --title "${{ steps.version.outputs.title }}" \
            --generate-notes \
            --notes 'Ad-hoc signed, not notarized — on first launch, right-click the app and choose **Open** (or run `xattr -cr Phantom.app` after unzipping) instead of double-clicking, or Gatekeeper will refuse it as from an unidentified developer. Later versions arrive through Phantom > Check for Updates.' \
            Phantom.dmg appcast.xml
